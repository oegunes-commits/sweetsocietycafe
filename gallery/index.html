const BATCH = 60;
let filtered = DATA, shown = 0, cat = 'all';
const grid = document.getElementById('grid');
const note = document.getElementById('note');
const lb = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');

function render(reset) {
  if (reset) { grid.innerHTML = ''; shown = 0; }
  const slice = filtered.slice(shown, shown + BATCH);
  const frag = document.createDocumentFragment();
  for (const it of slice) {
    const a = document.createElement('a');
    a.href = 'img/' + it.f;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = 'img/' + it.f;
    img.alt = it.t || 'Sweet Society creation';
    a.appendChild(img);
    a.addEventListener('click', e => {
      e.preventDefault();
      lbimg.src = a.href; lbimg.alt = img.alt;
      lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
    });
    frag.appendChild(a);
  }
  grid.appendChild(frag);
  shown += slice.length;
  note.textContent = shown + ' / ' + filtered.length;
}
lb.addEventListener('click', () => { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); lbimg.src=''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.click(); });

const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting && shown < filtered.length) render(false);
}, { rootMargin: '900px' });
io.observe(document.getElementById('sentinel'));

document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  cat = b.dataset.filter;
  document.querySelectorAll('.filters button').forEach(x => {
    x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b));
  });
  filtered = cat === 'all' ? DATA : DATA.filter(d => d.c === cat);
  render(true);
  window.scrollTo({ top: 0 });
}));
render(true);
</script>
